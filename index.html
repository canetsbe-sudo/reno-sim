<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3eee6" />
    <title>Reno Sim</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..600,50;1,9..144,400..600,50&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="title-screen" class="screen"></div>
    <div id="game" class="hidden">
      <header id="hud"></header>
      <main>
        <section id="stage">
          <div id="room-wrap"><canvas id="room"></canvas></div>
          <div id="stage-bar">
            <div id="room-hint"></div>
            <div id="dock">
              <div id="view-ctl" class="dock-group"></div>
              <div id="tools" class="dock-group"></div>
            </div>
          </div>
        </section>
        <aside id="panel"></aside>
      </main>
    </div>
    <div id="modal" class="hidden"></div>
    <div id="toast" role="status"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
